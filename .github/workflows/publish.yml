name: "Publish"
on:
  push:
    branches:
      - "main"
jobs:
  build:
    runs-on: "ubuntu-latest"
    permissions:
      pages: "write"
      id-token: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@094aa226ed0e8f079adf9b0803105ffdac7bb465"
        with:
          version: "0.12.0"
          enable-cache: true
      - name: "Build"
        run: "uv run mkdocs build --site-dir _site"
      - name: "📤 Upload"
        uses: "actions/upload-pages-artifact@v3"
  publish:
    needs: "build"
    runs-on: "ubuntu-latest"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: "Publish"
        uses: "actions/deploy-pages@v4"
